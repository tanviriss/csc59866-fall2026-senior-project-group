<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect x="0" y="0" width="1200" height="640" fill="#ffffff"/><text x="20" y="34" font-size="22" font-weight="bold">Figure 3. Context view: who and what the simulator talks to</text><rect x="420" y="230" width="360" height="170" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="600.0" y="252" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="600.0" dy="0">Fleet p99 simulator</tspan></text><text x="600.0" y="274" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="600.0" dy="0">One Python 3 program on my laptop.</tspan><tspan x="600.0" dy="16.25">Splits latencies across simulated hosts,</tspan><tspan x="600.0" dy="16.25">merges their summaries into a fleet p99,</tspan><tspan x="600.0" dy="16.25">and scores it against the exact p99.</tspan></text><rect x="40" y="250" width="220" height="130" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="150.0" y="272" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="150.0" dy="0">Researcher (me)</tspan></text><text x="150.0" y="294" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="150.0" dy="0">Stands in for the on call</tspan><tspan x="150.0" dy="16.25">engineer and the platform</tspan><tspan x="150.0" dy="16.25">team from Section 1</tspan></text><rect x="470" y="70" width="260" height="100" rx="8" fill="#dcefd9" stroke="#333333" stroke-width="1.6"/><text x="600.0" y="92" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="600.0" dy="0">Alibaba 2022 trace</tspan></text><text x="600.0" y="114" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="600.0" dy="0">Public microservices call graph</tspan><tspan x="600.0" dy="16.25">data on Alibaba's servers</tspan></text><rect x="40" y="470" width="280" height="110" rx="8" fill="#dcefd9" stroke="#333333" stroke-width="1.6"/><text x="180.0" y="492" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="180.0" dy="0">Open source packages</tspan></text><text x="180.0" y="514" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="180.0" dy="0">ddsketch 3.0.1, numpy 2.5.3</tspan><tspan x="180.0" dy="16.25">installed from PyPI</tspan></text><rect x="900" y="250" width="260" height="130" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="1030.0" y="272" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="1030.0" dy="0">Git repository</tspan></text><text x="1030.0" y="294" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="1030.0" dy="0">zihad-patwary branch: code,</tspan><tspan x="1030.0" dy="16.25">DESIGN.md, results CSV.</tspan><tspan x="1030.0" dy="16.25">No raw trace data</tspan></text><rect x="880" y="470" width="280" height="110" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.6"/><text x="1020.0" y="492" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="1020.0" dy="0">Reviewer (Tanvir, professor)</tspan></text><text x="1020.0" y="514" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="1020.0" dy="0">Reads results and reruns</tspan><tspan x="1020.0" dy="16.25">the grid from the repository</tspan></text><path d="M260,300 L420,300" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="340" y="290" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a"><tspan x="340" dy="0">grid settings (grid.json)</tspan></text><path d="M420,345 L260,345" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="340" y="365" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a"><tspan x="340" dy="0">results CSV, run log,</tspan><tspan x="340" dy="15.625">figures</tspan></text><path d="M600,170 L600,230" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="612" y="196" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="612" dy="0">one 3 minute CallGraph file,</tspan><tspan x="612" dy="15.625">downloaded once by hand, kept on local disk</tspan></text><path d="M260,470 L470,400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="330" y="470" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="330" dy="0">imported at run time</tspan></text><path d="M780,315 L900,315" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="840" y="305" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a"><tspan x="840" dy="0">git push</tspan></text><path d="M1030,470 L1030,380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="1042" y="430" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="1042" dy="0">git pull, rerun</tspan></text><rect x="470" y="480" width="22" height="16" fill="#dbe8f7" stroke="#333333"/><text x="502" y="493" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="502" dy="0">I build it</tspan></text><rect x="470" y="504" width="22" height="16" fill="#dcefd9" stroke="#333333"/><text x="502" y="517" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="502" dy="0">Reused open source or public data</tspan></text><rect x="470" y="528" width="22" height="16" fill="#ffffff" stroke="#333333"/><text x="502" y="541" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="502" dy="0">Person or outside system</tspan></text><text x="600" y="610" font-size="13" text-anchor="middle" font-weight="normal" fill="#444"><tspan x="600" dy="0">Nothing runs on a real network. Real hosts and the monitoring pipeline are out of scope (Section 1).</tspan></text></svg>