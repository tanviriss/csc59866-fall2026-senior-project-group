<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs><rect x="0" y="0" width="1240" height="920" fill="#ffffff"/><text x="20" y="34" font-size="22" font-weight="bold">Figure 4. Architecture view: parts, messages and saved state inside one run</text><rect x="20" y="150" width="1200" height="560" rx="10" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="10 6"/><text x="180" y="700" font-size="13.5" text-anchor="start" font-weight="normal" fill="#444"><tspan x="180" dy="0">Runs in: one Python 3 process on my laptop (run_grid.py). Arrows inside are function calls passing the named record.</tspan></text><path d="M40,59 a115.0,9 0 0,1 230,0 v70 a115.0,9 0 0,1 -230,0 z" fill="#eeeeee" stroke="#333333" stroke-width="1.6"/><path d="M40,59 a115.0,9 0 0,0 230,0" fill="none" stroke="#333333" stroke-width="1.6"/><text x="155.0" y="84" font-size="14" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="155.0" dy="0">grid.json</tspan></text><text x="155.0" y="104" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="155.0" dy="0">hosts, budgets, skews, seeds</tspan></text><rect x="40" y="200" width="230" height="130" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="155.0" y="222" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="155.0" dy="0">1 Run controller</tspan></text><text x="155.0" y="244" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="155.0" dy="0">Reads the grid, loops over</tspan><tspan x="155.0" dy="16.25">settings and seeds, plans</tspan><tspan x="155.0" dy="16.25">dropped or duplicate reports</tspan></text><rect x="40" y="400" width="230" height="150" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="155.0" y="422" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="155.0" dy="0">2 Data source</tspan></text><text x="155.0" y="444" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="155.0" dy="0">Synthetic generator (numpy)</tspan><tspan x="155.0" dy="16.25">or Alibaba loader: keeps</tspan><tspan x="155.0" dy="16.25">rt &gt; 0, counts dropped</tspan><tspan x="155.0" dy="16.25">rows by reason</tspan></text><rect x="340" y="400" width="205" height="150" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="442.5" y="422" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="442.5" dy="0">3 Partitioner</tspan></text><text x="442.5" y="444" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="442.5" dy="0">Gives every latency one</tspan><tspan x="442.5" dy="16.25">host ID by traffic skew</tspan><tspan x="442.5" dy="16.25">or by container; counts</tspan><tspan x="442.5" dy="16.25">requests per host</tspan></text><rect x="631" y="364" width="225" height="170" rx="8" fill="#fde3c4" stroke="#333333" stroke-width="1.2"/><rect x="623" y="372" width="225" height="170" rx="8" fill="#fde3c4" stroke="#333333" stroke-width="1.2"/><rect x="615" y="380" width="225" height="170" rx="8" fill="#fde3c4" stroke="#333333" stroke-width="1.6"/><text x="727.5" y="402" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="727.5" dy="0">4 Host builder x H</tspan></text><text x="727.5" y="424" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="727.5" dy="0">One per simulated host.</tspan><tspan x="727.5" dy="16.25">Sees only its partition.</tspan><tspan x="727.5" dy="16.25">Builds one DDSketch</tspan><tspan x="727.5" dy="16.25">within its byte budget</tspan></text><rect x="652" y="508" width="150" height="26" rx="5" fill="#dcefd9" stroke="#333333"/><text x="727" y="526" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="727" dy="0">ddsketch (reused)</tspan></text><rect x="930" y="380" width="260" height="170" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="1060.0" y="402" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="1060.0" dy="0">5 Coordinator</tspan></text><text x="1060.0" y="424" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="1060.0" dy="0">Checks each envelope: host ID</tspan><tspan x="1060.0" dy="16.25">expected and not repeated,</tspan><tspan x="1060.0" dy="16.25">same alpha. Merges sketches.</tspan><tspan x="1060.0" dy="16.25">Answers quantile q with</tspan><tspan x="1060.0" dy="16.25">hosts and requests covered</tspan></text><rect x="615" y="590" width="225" height="90" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="727.5" y="612" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="727.5" dy="0">6 Exact reference</tspan></text><text x="727.5" y="634" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="727.5" dy="0">Pools all latencies, takes</tspan><tspan x="727.5" dy="16.25">nearest rank quantile</tspan></text><rect x="930" y="590" width="260" height="90" rx="8" fill="#dbe8f7" stroke="#333333" stroke-width="1.6"/><text x="1060.0" y="612" font-size="15" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="1060.0" dy="0">7 Scorer</tspan></text><text x="1060.0" y="634" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="1060.0" dy="0">Relative error, 300 ms page flip,</tspan><tspan x="1060.0" dy="16.25">bound check (C4), result row</tspan></text><path d="M40,754 a115.0,9 0 0,1 230,0 v74 a115.0,9 0 0,1 -230,0 z" fill="#eeeeee" stroke="#333333" stroke-width="1.6"/><path d="M40,754 a115.0,9 0 0,0 230,0" fill="none" stroke="#333333" stroke-width="1.6"/><text x="155.0" y="779" font-size="14" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="155.0" dy="0">CallGraph slice</tspan></text><text x="155.0" y="799" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="155.0" dy="0">one 3 minute Alibaba file,</tspan><tspan x="155.0" dy="16.25">local disk, not committed</tspan></text><path d="M930,754 a130.0,9 0 0,1 260,0 v74 a130.0,9 0 0,1 -260,0 z" fill="#eeeeee" stroke="#333333" stroke-width="1.6"/><path d="M930,754 a130.0,9 0 0,0 260,0" fill="none" stroke="#333333" stroke-width="1.6"/><text x="1060.0" y="779" font-size="14" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="1060.0" dy="0">evidence/results.csv</tspan></text><text x="1060.0" y="799" font-size="13" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="1060.0" dy="0">one row per setting, method,</tspan><tspan x="1060.0" dy="16.25">q, seed; plus run_log.txt</tspan></text><path d="M155,138 L155,200" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="165" y="174" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="165" dy="0">read once</tspan></text><path d="M270,265 L1060,265 L1060,380" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="660" y="255" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1a1a1a"><tspan x="660" dy="0">setting: H, budget, alpha, expected host IDs, fault plan (for example drop host 3, send host B twice)</tspan></text><path d="M155,330 L155,400" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="165" y="370" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="165" dy="0">load(dataset, seed)</tspan></text><path d="M155,745 L155,550" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="165" y="722" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="165" dy="0">read in 1 M</tspan><tspan x="165" dy="15.625">row chunks</tspan></text><path d="M270,475 L340,475" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="305" y="440" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="305" dy="0">latencies</tspan><tspan x="305" dy="15.0">(ms)</tspan></text><path d="M545,465 L615,465" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="580" y="440" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="580" dy="0">partition h</tspan><tspan x="580" dy="15.0">+ count</tspan></text><path d="M442,550 L442,640 L615,640" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="452" y="605" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="452" dy="0">all latencies</tspan></text><path d="M856,465 L930,465" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="893" y="425" font-size="12" text-anchor="middle" font-weight="bold" fill="#111"><tspan x="893" dy="0">Summary</tspan><tspan x="893" dy="15.0">Envelope</tspan></text><path d="M1060,550 L1060,590" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="1070" y="576" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="1070" dy="0">FleetAnswer or error</tspan></text><path d="M840,635 L930,635" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="885" y="618" font-size="12" text-anchor="middle" font-weight="normal" fill="#111"><tspan x="885" dy="0">exact q</tspan></text><path d="M1060,680 L1060,745" fill="none" stroke="#333333" stroke-width="1.8" marker-end="url(#ah)"/><text x="1070" y="732" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1a1a1a"><tspan x="1070" dy="0">one row</tspan></text><rect x="330" y="748" width="22" height="16" fill="#dbe8f7" stroke="#333333"/><text x="362" y="761" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="362" dy="0">I build it</tspan></text><rect x="330" y="772" width="22" height="16" fill="#dcefd9" stroke="#333333"/><text x="362" y="785" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="362" dy="0">Reused open source or public data</tspan></text><rect x="330" y="796" width="22" height="16" fill="#fde3c4" stroke="#333333"/><text x="362" y="809" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="362" dy="0">Simulated stand in for a real thing</tspan></text><rect x="330" y="820" width="22" height="16" fill="#eeeeee" stroke="#333333"/><text x="362" y="833" font-size="13" text-anchor="start" font-weight="normal" fill="#111"><tspan x="362" dy="0">Saved state on disk</tspan></text><text x="330" y="872" font-size="13" text-anchor="start" font-weight="normal" fill="#333"><tspan x="330" dy="0">Simulated: hosts are objects, not machines, and the network is function calls, so there is no delay or loss</tspan><tspan x="330" dy="16.25">unless the controller injects it. Reused: ddsketch, numpy, the Alibaba trace. Everything else I build.</tspan></text></svg>