<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><style>
body{margin:0;background:#fff}
text{font-family:Helvetica,Arial,sans-serif}
.n{font-size:15px;font-weight:700;fill:#666;letter-spacing:1px}
.t{font-size:19px;font-weight:700;fill:#1a1a1a}
.d{font-size:16px;fill:#444}
.r{font-size:18px;fill:#1a1a1a}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="40" y="44" font-size="28" font-weight="700" fill="#1a1a1a">Current workflow: from host measurements to an on call decision</text>
<text x="40" y="72" font-size="17" fill="#555">Steps as I understand them from the sources in Section 12. I have not observed a real team doing this.</text>

<g stroke="#555" stroke-width="2.5" fill="none">
<line x1="240" y1="175" x2="266" y2="175" marker-end="url(#a)"/>
<line x1="470" y1="175" x2="496" y2="175" marker-end="url(#a)"/>
<line x1="700" y1="175" x2="726" y2="175" marker-end="url(#a)"/>
<line x1="930" y1="175" x2="956" y2="175" marker-end="url(#a)"/>
<line x1="600" y1="240" x2="600" y2="292" marker-end="url(#a)"/>
</g>

<rect x="40" y="110" width="200" height="130" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<text x="56" y="136" class="n">STEP 1</text><text x="56" y="162" class="t">Record</text>
<text x="56" y="188" class="d">Each host times every</text><text x="56" y="210" class="d">request it serves</text>

<rect x="270" y="110" width="200" height="130" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<text x="286" y="136" class="n">STEP 2</text><text x="286" y="162" class="t">Report</text>
<text x="286" y="188" class="d">Each host reports to</text><text x="286" y="210" class="d">the monitoring system</text>

<rect x="500" y="110" width="200" height="130" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="3"/>
<text x="516" y="136" class="n" style="fill:#b3261e">STEP 3</text><text x="516" y="162" class="t" style="fill:#b3261e">Combine</text>
<text x="516" y="188" class="d">Host reports become</text><text x="516" y="210" class="d">one fleet p99. <tspan font-weight="700" fill="#b3261e">Fails here</tspan></text>

<rect x="730" y="110" width="200" height="130" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<text x="746" y="136" class="n">STEP 4</text><text x="746" y="162" class="t">Display</text>
<text x="746" y="188" class="d">Dashboard shows the</text><text x="746" y="210" class="d">number and may alert</text>

<rect x="960" y="110" width="200" height="130" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<text x="976" y="136" class="n">STEP 5</text><text x="976" y="162" class="t">Decide</text>
<text x="976" y="188" class="d">Engineer investigates,</text><text x="976" y="210" class="d">pages someone or waits</text>

<rect x="40" y="296" width="1120" height="290" rx="8" fill="#fff" stroke="#bbb" stroke-width="2"/>
<text x="60" y="328" font-size="20" font-weight="700" fill="#1a1a1a">What step 3 can produce for the example in Section 1</text>
<text x="60" y="352" class="d">Host A: 1,000,000 requests, local p99 50 ms. Host B: 1,000 requests, local p99 900 ms. Illustrative numbers.</text>

<g>
<rect x="60" y="370" width="1080" height="46" rx="6" fill="#fdecea"/>
<text x="76" y="400" class="r"><tspan font-weight="700">Average the local p99 values</tspan></text>
<text x="1124" y="400" class="r" text-anchor="end" fill="#b3261e" font-weight="700">475 ms, about 9.5 times too high: a false alarm</text>
<rect x="60" y="422" width="1080" height="46" rx="6" fill="#e8f5ec"/>
<text x="76" y="452" class="r"><tspan font-weight="700">Ship every measurement to one place</tspan></text>
<text x="1124" y="452" class="r" text-anchor="end" fill="#1e7a34" font-weight="700">About 50 ms, exact, but cost grows with traffic</text>
<rect x="60" y="474" width="1080" height="46" rx="6" fill="#fff8e6"/>
<text x="76" y="504" class="r"><tspan font-weight="700">Add up fixed bucket histograms</tspan></text>
<text x="1124" y="504" class="r" text-anchor="end" fill="#8a5a00" font-weight="700">Near 50 ms, error depends on the bucket layout</text>
<rect x="60" y="526" width="1080" height="46" rx="6" fill="#eef4ff" stroke="#2457a6" stroke-width="2" stroke-dasharray="8 6"/>
<text x="76" y="556" class="r" fill="#2457a6"><tspan font-weight="700">Merge quantile sketches (this project)</tspan></text>
<text x="1124" y="556" class="r" text-anchor="end" fill="#2457a6" font-weight="700">Error against the exact answer: to be measured</text>
</g>
<text x="40" y="618" class="d">Whatever step 3 produces is the only number the engineer sees in steps 4 and 5.</text>
</svg>
