<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg"><style>
body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif}
text{font-family:Helvetica,Arial,sans-serif}
.t{font-size:20px;font-weight:700;fill:#1a1a1a}
.d{font-size:17px;fill:#444}
.h{font-size:15px;font-weight:700;fill:#666;letter-spacing:1px}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<text x="40" y="46" font-size="30" font-weight="700" fill="#1a1a1a">How a fleet p99 gets produced, and where this project fits</text>
<text x="40" y="76" font-size="19" fill="#555">Same two hosts as Figure 1. Numbers are illustrative, not measured.</text>
<text x="40" y="118" class="h">DATA SOURCES</text><text x="340" y="118" class="h">WAYS TO COMBINE THEM</text><text x="780" y="118" class="h">RESULT FOR THIS EXAMPLE</text>

<!-- hosts -->
<rect x="40" y="190" width="210" height="100" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<text x="56" y="222" class="t">Host A</text><text x="56" y="248" class="d">1,000,000 requests</text><text x="56" y="272" class="d">local p99 50 ms</text>
<rect x="40" y="330" width="210" height="100" rx="8" fill="#f3f4f6" stroke="#555" stroke-width="2"/>
<text x="56" y="362" class="t">Host B</text><text x="56" y="388" class="d">1,000 requests</text><text x="56" y="412" class="d">local p99 900 ms</text>
<!-- bus -->
<g stroke="#555" stroke-width="2.5" fill="none">
<line x1="250" y1="240" x2="295" y2="240"/><line x1="250" y1="380" x2="295" y2="380"/>
<line x1="295" y1="175" x2="295" y2="535"/>
<line x1="295" y1="175" x2="336" y2="175" marker-end="url(#a)"/>
<line x1="295" y1="295" x2="336" y2="295" marker-end="url(#a)"/>
<line x1="295" y1="415" x2="336" y2="415" marker-end="url(#a)"/>
<line x1="295" y1="535" x2="336" y2="535" marker-end="url(#a)"/>
<line x1="720" y1="175" x2="776" y2="175" marker-end="url(#a)"/>
<line x1="720" y1="295" x2="776" y2="295" marker-end="url(#a)"/>
<line x1="720" y1="415" x2="776" y2="415" marker-end="url(#a)"/>
<line x1="720" y1="535" x2="776" y2="535" stroke-dasharray="7 6" marker-end="url(#a)"/>
</g>

<!-- routes -->
<rect x="340" y="127" width="380" height="96" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="356" y="158" class="t">1 Average the local p99 values</text>
<text x="356" y="184" class="d">Each host sends one number. A central</text><text x="356" y="206" class="d">system averages them.</text>
<rect x="340" y="247" width="380" height="96" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="356" y="278" class="t">2 Ship every measurement</text>
<text x="356" y="304" class="d">All requests go to one store, and the</text><text x="356" y="326" class="d">p99 is computed there.</text>
<rect x="340" y="367" width="380" height="96" rx="8" fill="#fff" stroke="#555" stroke-width="2"/>
<text x="356" y="398" class="t">3 Merge fixed bucket histograms</text>
<text x="356" y="424" class="d">Hosts send counts per latency bucket.</text><text x="356" y="446" class="d">Counts add across hosts.</text>
<rect x="340" y="487" width="380" height="96" rx="8" fill="#eef4ff" stroke="#2457a6" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="356" y="518" class="t" style="fill:#2457a6">4 Merge mergeable sketches</text>
<text x="356" y="544" class="d">Hosts send small summaries such as</text><text x="356" y="566" class="d">DDSketch. This is the project's focus.</text>

<!-- results -->
<rect x="780" y="127" width="380" height="96" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
<text x="796" y="158" class="t" style="fill:#b3261e">475 ms, about 9.5 times too high</text>
<text x="796" y="184" class="d">Gives Host B half the weight even</text><text x="796" y="206" class="d">though it served 0.1 percent of requests.</text>
<rect x="780" y="247" width="380" height="96" rx="8" fill="#e8f5ec" stroke="#1e7a34" stroke-width="2"/>
<text x="796" y="278" class="t" style="fill:#1e7a34">About 50 ms, exact</text>
<text x="796" y="304" class="d">Cost grows with traffic: bandwidth,</text><text x="796" y="326" class="d">storage and query time.</text>
<rect x="780" y="367" width="380" height="96" rx="8" fill="#fff8e6" stroke="#b7791f" stroke-width="2"/>
<text x="796" y="398" class="t" style="fill:#8a5a00">Close to 50 ms, approximate</text>
<text x="796" y="424" class="d">Error depends on the bucket layout.</text><text x="796" y="446" class="d">Still to verify in Section 3.</text>
<rect x="780" y="487" width="380" height="96" rx="8" fill="#fff" stroke="#2457a6" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="796" y="518" class="t" style="fill:#2457a6">To be measured</text>
<text x="796" y="544" class="d">Relative error at p99 compared with</text><text x="796" y="566" class="d">the exact answer, at several memory sizes.</text>

<line x1="40" y1="622" x2="1160" y2="622" stroke="#ddd" stroke-width="2"/>
<text x="40" y="652" class="d">Routes 1 to 3 are described from the sources in Section 1.4. I have not observed them in a real company pipeline.</text>
<text x="40" y="678" class="d">Dashed outline marks the part this project adds. The simulation compares routes 1 and 4, plus a uniform sample, against route 2 as the exact baseline.</text>
</svg>
